{% load static %}

<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up</title>
<link rel="stylesheet" href="{% static 'accounts/css/login.css' %}">
</head>

<body>
<div class="login-page">
    <div class="login-card">
        
        <div class="login-header">
            <div class="logo">✦</div>
            <h1>Create Account</h1>
            <p>
                Create your account to get started
            </p>
        </div>
        
        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <div class="message">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}
        
        <form method="POST">
            {% csrf_token %}
            <div class="input-group">
                <label for="username">
                    Username
                </label>
                <input type="text"id="username"name="username"placeholder="Choose a username"autocomplete="username"required>
            </div>
            <div class="input-group">
                <label for="password">
                    Password
                </label>
                <input
                    type="password" id="password" name="password" placeholder="Create a password"autocomplete="new-password"required>
            </div>
            <div class="input-group">
                <label for="password2">
                    Confirm Password
                </label>
                <input
                    type="password"
                    id="password2"
                    name="password2"
                    placeholder="Confirm your password"
                    autocomplete="new-password"
                    required>
            </div>
            <button type="submit" class="login-btn">
                Create Account
                <span>→</span>
            </button>
        </form>
        <div class="signup-text">
            <span>
                Already have an account?
            </span>
            <a href="{% url 'accounts:login' %}">
                Login
            </a>
        </div>
    </div>
</div>
</body>
</html>
