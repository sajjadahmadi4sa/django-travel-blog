{% load static %}

<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<link rel="stylesheet" href="{% static 'accounts/css/login.css' %}">

</head>
<body>
<div class="login-page">

    <div class="login-card">

        <!-- Login Header -->
        <div class="login-header">

            <div class="logo">✦</div>

            <h1>Welcome Back</h1>

            <p>
                Login to continue to your account
            </p>

        </div>


        <!-- Django Messages -->
        {% if messages %}

            <div class="messages">

                {% for message in messages %}

                    <div class="message">
                        {{ message }}
                    </div>

                {% endfor %}

            </div>

        {% endif %}


        <!-- Login Form -->
        <form method="POST">

            {% csrf_token %}

            <!-- Username -->
            <div class="input-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    autocomplete="username"
                    required
                >

            </div>


            <!-- Password -->
            <div class="input-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <!-- Login Button -->
            <button
                type="submit"
                class="login-btn"
            >
                Login
                <span>→</span>
            </button>

        </form>


        <!-- Signup Link -->
        <div class="signup-text">

            <span>
                Don't have an account?
            </span>

            <a href="{% url 'accounts:signup' %}">
                Sign Up
            </a>

        </div>

    </div>

</div>


</body>
</html>
