<div class="sidebar-box ftco-animate">
    <h3>Tag Cloud</h3>

    <div class="tagcloud">
        {% for tag in tags %}
            <a href="{% url 'blog:tag' tag_name=tag.name %}"
               class="tag-cloud-link">
                {{ tag.name }}
            </a>
        {% endfor %}
    </div>
</div>
